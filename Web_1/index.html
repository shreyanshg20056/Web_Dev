    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <link rel="stylesheet" href="style.css">

<body>
    <!-- IMPORTANT TAGS IN HTML
     <br> this is line break tag which helps to write from the next line 
     And there's <b> and <i> bold and italic tag to turn normal text into bold style or italic style
    To underline the text we use <u> tag
    <strong> and <b> works same both turn text into bold style
    <strike> or <del> tag make a line or we say cut the text to show correction
     <mark> tag highlight the text
    <font> tag is used to change the font size, color and face of the text
    <emp> tag is used to emphasize the text
    <abbr> tag is used to show the full form of the abbreviation when we hover over it
    <address> tag is used to show the address of the person or company
    <q> tag is used to show the quotation text
    <code> tag is used to show the code text
        -->
    <h1><b> Hello World </b> </h1>
    <br>
    <p> This Is My <b><i><u><font size= "4" color= "grey" face= "san-serif">First Webpage</font></u></i></b> </p>
    <br>
    <p>I am learning <mark><em>web development</em></mark></p>
</body>
</html>
