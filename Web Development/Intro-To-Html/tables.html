<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tables</title>
  <style>
    td{
      border: 2px solid black;

    }

  </style>
</head>
<body>
  <!-- 
  rowspan - occupies row for choosen data
  colspan - occupies columns for choosen data
   -->
  <caption>Employee Details</caption>
  <table>
    <thead>
      <tr>
      <th>Name</th>
      <th>Designation</th>
      <th>Fav Language</th>
    </tr>
    </thead>
    <tbody>
      <tr>
      <td>Shriyansh</td>
      <td>Programmer</td>
      <td>Python</td>
    </tr>
    <tr>
    </tbody>
    <tfoot>
      <td colspan = 2 rowspan = 2>Shaun</td>
      <td>Java</td>
    </tr>
    </tfoot>
      
  </table>
  <ul>
    <li>Shriyansh</li>
    <li>Shubham</li>
    <li>Lizz</li>
  </ul>
  <ol type = I>
    <li>Shriyansh</li>
    <li>Shubham</li>
    <li>Lizz</li>
  </ol>
  <dl>
    <dt>HTML</dt>
    <dd>
      html is a web development programming language
    </dd>
  </dl>
</body>
</html>
